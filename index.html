<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Бюджет">
<title>Мой Бюджет</title>
<style>
:root{--bg:#121212;--card:#1e1e1e;--card2:#262626;--text:#fff;--muted:#a3a3a3;--primary:#bb86fc;--expense:#cf6679;--income:#03dac6;--warn:#ffb74d;--line:#303030}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#121212;overscroll-behavior:none;height:-webkit-fill-available;}
body{margin:0;overscroll-behavior:none;touch-action:pan-x pan-y;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
.sheet{overscroll-behavior:contain}
#app{max-width:480px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(150px + env(safe-area-inset-bottom));width:100%;flex:1;}
h1{font-size:22px;margin:0 0 14px}
h3{font-size:16px;margin:22px 0 10px;font-weight:600}
.muted{color:var(--muted)}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:12px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px}
.hero{background:linear-gradient(135deg,#2c1a4d,#120b24);border-radius:24px;padding:22px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.hero .lbl{font-size:13px;color:var(--muted)}
.hero .big{font-size:34px;font-weight:700;margin:4px 0 14px}
.hmonth{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;font-size:13px;color:var(--muted)}
.hbtn{background:rgba(255,255,255,.1);border:none;color:#fff;width:34px;height:28px;border-radius:9px;font-size:16px;line-height:1;cursor:pointer}
.hbtn:active{background:rgba(255,255,255,.2)}
.split{display:flex;gap:10px}
.split>div[data-act]{cursor:pointer}
.split>div{flex:1;background:rgba(255,255,255,.06);border-radius:14px;padding:10px 12px;cursor:pointer}
.split>div:active{background:rgba(255,255,255,.14)}
.split .v{font-weight:600;margin-top:2px}
.plus{color:var(--income)}.minus{color:var(--expense)}.tr{color:var(--text)}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.monthbar b{font-size:17px}
.iconbtn{background:var(--card);border:none;color:var(--text);width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer}
.tx{display:flex;align-items:center;gap:12px;background:var(--card);padding:12px 14px;border-radius:14px;margin-bottom:8px;cursor:pointer}
.ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.amt{font-weight:600;white-space:nowrap}
.dayhead{font-size:13px;color:var(--muted);margin:16px 2px 8px}

.accs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;}
.acc{flex:none;min-width:140px;background:var(--card);border-radius:16px;padding:12px 14px;border-left:4px solid var(--primary)}
.acc .b{font-weight:600;margin-top:4px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:16px;font-family:inherit}
@supports (-webkit-touch-callout:none){
  input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:46px;text-align:left}
  input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.2em}
}
input[type=checkbox]{width:20px;height:20px}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
.btn{width:100%;padding:14px;border-radius:12px;border:none;background:var(--primary);color:#000;font-weight:700;font-size:16px;cursor:pointer;margin-top:14px}
.btn.sec{background:var(--card2);color:var(--text)}
.btn.danger{background:transparent;color:var(--expense);border:1px solid var(--expense)}
.btn:active{transform:scale(.98)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 12px;border-radius:20px;background:var(--card2);border:1px solid transparent;font-size:14px;cursor:pointer;color:var(--text)}
.chip.on{border-color:var(--primary);background:#2a1f3d}
.tabs{display:flex;background:var(--card);border-radius:14px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:none;background:none;color:var(--muted);border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--card2);color:var(--text)}
.tabs button.on.e{color:var(--expense)}.tabs button.on.i{color:var(--income)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav>div{max-width:480px;margin:0 auto;display:flex}
.nav button{flex:1;background:none;border:none;color:var(--muted);padding:10px 0 8px;font-size:11px;cursor:pointer}
.nav button span{display:block;font-size:20px;margin-bottom:2px}
.nav button.on{color:var(--primary)}
.fab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));right:max(16px,calc(50% - 224px));width:58px;height:58px;border-radius:50%;border:none;background:var(--primary);color:#000;font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.5);z-index:6;cursor:pointer}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:calc(100% - env(safe-area-inset-top) - 10px);overflow-y:auto;overflow-x:hidden;border-radius:24px 24px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));position:relative}
.sheet h2{margin:0 0 6px;font-size:18px;padding-right:24px;}
.close-btn{position:absolute;top:14px;right:14px;background:transparent;border:none;color:var(--muted);font-size:26px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:8px;z-index:10;}
.close-btn:hover{color:var(--text);}
@media (pointer: coarse){.close-btn{display:none !important;}}
.amount-in{font-size:32px;font-weight:700;text-align:center;padding:14px}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{background:var(--card2);border:1px solid transparent;border-radius:12px;padding:8px 2px;text-align:center;font-size:11px;cursor:pointer;color:var(--text)}
.cat span{display:block;font-size:22px}
.cat.on{border-color:var(--primary);background:#2a1f3d}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emo{background:var(--card2);border:1px solid transparent;border-radius:10px;font-size:20px;padding:6px 0;text-align:center;cursor:pointer}
.emo.on{border-color:var(--primary)}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.col{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.col.on{border-color:#fff}
.bar{height:8px;background:var(--card2);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:6px}
.menu{display:flex;align-items:center;gap:14px;background:var(--card);padding:14px;border-radius:14px;margin-bottom:8px;cursor:pointer}
.menu .ico{background:var(--card2)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.banner{background:#3a2a10;border:1px solid var(--warn);color:var(--warn);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:13px;cursor:pointer}
.legend .tx{cursor:pointer;padding:10px 12px}
#acclist .menu{touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.menu.dragging{position:relative;z-index:8;box-shadow:0 10px 28px rgba(0,0,0,.55);background:#2d2d2d}
details.faq{background:var(--card);border-radius:14px;margin-bottom:8px;padding:0 14px}
details.faq summary{padding:14px 0;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:'▾';color:var(--muted)}
details.faq[open] summary::after{content:'▴'}
details.faq .body{padding:0 0 14px;color:#d6d6d6;font-size:14px;line-height:1.55}
details.faq .body p{margin:0 0 10px}
details.faq .body ul,details.faq .body ol{margin:0 0 10px;padding-left:20px}
details.faq .body li{margin-bottom:4px}
.hl{color:var(--primary);font-weight:600}
.tip{background:#2a1f3d;border-radius:10px;padding:10px 12px;margin:0 0 10px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#3a3a3a;color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;white-space:normal;text-align:center;line-height:1.4;width:max-content;max-width:calc(100vw - 32px)}
#toast.show{opacity:1}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.pick{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background-color:var(--card2);color:var(--text);font-size:16px;font-family:inherit;text-align:left;cursor:pointer;-webkit-appearance:none;appearance:none;outline:none;box-sizing:border-box;}
.pick span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick i{flex:none;font-style:normal;color:var(--muted);font-size:14px;margin-left:10px}
#pickov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
#pickov .plist{background:var(--card);width:100%;max-width:480px;max-height:70vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:20px 20px 0 0;padding:6px 0 calc(12px + env(safe-area-inset-bottom));}
#pickov .popt{display:flex;align-items:center;gap:12px;padding:14px 18px;font-size:16px;cursor:pointer;border-bottom:1px solid var(--line);min-height:56px}
#pickov .popt:last-child{border-bottom:none}
#pickov .popt:active{background:rgba(255,255,255,.08)}
#pickov .popt .ic{flex:none;width:30px;text-align:center;font-size:20px;line-height:1}
#pickov .popt .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pickov .popt .r{flex:none;margin-left:auto;width:22px;height:22px;box-sizing:border-box;border-radius:50%;border:2px solid var(--muted);position:relative}
#pickov .popt.on .r{border-color:var(--primary)}
#pickov .popt.on .r::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--primary)}
@media (pointer: coarse){
  ::-webkit-scrollbar{display:none !important;width:0 !important;height:0 !important;}
  *{-ms-overflow-style:none !important;scrollbar-width:none !important;}
}
@media (pointer: fine){
  .accs{padding-bottom:8px;scrollbar-width:thin;scrollbar-color:#4a4a4a transparent;}
  .accs::-webkit-scrollbar{height:6px;}
  .accs::-webkit-scrollbar-track{background:transparent;}
  .accs::-webkit-scrollbar-thumb{background:#4a4a4a;border-radius:10px;}
  .accs::-webkit-scrollbar-thumb:hover{background:#666;}
  .sheet{-ms-overflow-style:none;scrollbar-width:none;}
  .sheet::-webkit-scrollbar{display:none;}
  #pickov .plist{-ms-overflow-style:none;scrollbar-width:none;}
  #pickov .plist::-webkit-scrollbar{display:none;}
}
</style>
</head>
<body>
<div id="app"></div>
<button class="fab" data-act="addTx" aria-label="Добавить операцию">+</button>
<div class="nav"><div id="nav"></div></div>
<div id="modal" data-act="backdrop"></div>
<div id="toast"></div>
<input type="file" id="importFile" accept=".json,.txt,application/json,text/plain" hidden>

<script>
'use strict';
const NATIVE = !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
const IS_MOBILE = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

const DB_NAME = 'MoneyKeeperDB';
const STORES = ['accounts', 'categories', 'transactions', 'budgets', 'recurring', 'meta'];
let db;

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      STORES.forEach(s => {
        if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id', autoIncrement: s !== 'meta' });
      });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const store = (s, mode = 'readonly') => db.transaction(s, mode).objectStore(s);
const dbAll = s => req(store(s).getAll());
async function dbPut(s, o) { const k = await req(store(s, 'readwrite').put(o)); o.id = k; return o; }
const dbDel = (s, id) => req(store(s, 'readwrite').delete(id));
const dbClear = s => req(store(s, 'readwrite').clear());

const S = { accounts: [], categories: [], transactions: [], budgets: [], recurring: [], settings: { currency: '₽', lastBackup: null } };
let suppressClickUntil = 0;
const sortAccounts = () => S.accounts.sort((a, b) => (a.order ?? a.id) - (b.order ?? b.id));
const now = new Date();
const U = { tab: 'home', sub: null, month: { y: now.getFullYear(), m: now.getMonth() }, monthX: { y: now.getFullYear(), m: now.getMonth() }, q: '', opsType: 'all', statType: 'expense', statCat: null, catType: 'expense' };
const M = () => U.tab === 'home' ? U.month : U.monthX;

const EMOJIS = ['🛒','🚗','🏠','☕','💊','👕','🎮','📱','🎁','📦','💼','💻','💰','💳','💵','🏦','✈️','🍔','🍕','🎬','📚','🐶','⚽','🔧','💡','🚌','⛽','👶','💅','🎓','🏋️','🧾','📈','🏷️','🛠️','🎵','🍷','🧴','🚕','❤️'];
const COLORS = ['#bb86fc','#03dac6','#cf6679','#ffb74d','#64b5f6','#81c784','#f06292','#a1887f','#4db6ac','#90a4ae'];
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_G = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD = ['вс','пн','вт','ср','чт','пт','сб'];
const FREQ = { daily: 'Каждый день', weekly: 'Каждую неделю', monthly: 'Каждый месяц', yearly: 'Каждый год' };

const DEFAULT_CATS = [
  ['expense','Продукты','🛒','#81c784'],['expense','Транспорт','🚗','#64b5f6'],['expense','ЖКХ','🏠','#ffb74d'],
  ['expense','Кафе','☕','#a1887f'],['expense','Здоровье','💊','#f06292'],['expense','Одежда','👕','#bb86fc'],
  ['expense','Развлечения','🎮','#4db6ac'],['expense','Связь','📱','#90a4ae'],['expense','Подарки','🎁','#cf6679'],
  ['expense','Прочее','📦','#90a4ae'],
  ['income','Зарплата','💼','#03dac6'],['income','Подработка','💻','#64b5f6'],['income','Подарки','🎁','#f06292'],['income','Прочее','💰','#81c784']
];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r2 = n => Math.round(n * 100) / 100;
const fmt = n => r2(n).toLocaleString('ru-RU', { maximumFractionDigits: 2 }) + ' ' + S.settings.currency;
const pad = n => String(n).padStart(2, '0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => dstr(new Date());
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const mkey = (y, m) => `${y}-${pad(m + 1)}`;
const catOf = id => S.categories.find(c => c.id === id);
const accOf = id => S.accounts.find(a => a.id === id);
const upsert = (arr, o) => { const i = arr.findIndex(x => x.id === o.id); if (i >= 0) arr[i] = o; else arr.push(o); };
const toast = m => alert(m);

function dateLabel(s) {
  const t = today(), y = dstr(new Date(Date.now() - 864e5));
  if (s === t) return 'Сегодня';
  if (s === y) return 'Вчера';
  const d = parseD(s);
  return `${d.getDate()} ${MONTHS_G[d.getMonth()]}, ${WD[d.getDay()]}`;
}
function nextOcc(s, f, anchor) {
  const d = parseD(s);
  if (f === 'daily') d.setDate(d.getDate() + 1);
  else if (f === 'weekly') d.setDate(d.getDate() + 7);
  else {
    const y = d.getFullYear(), m = d.getMonth() + (f === 'monthly' ? 1 : 12);
    const last = new Date(y, m + 1, 0).getDate();
    return dstr(new Date(y, m, Math.min(anchor || d.getDate(), last)));
  }
  return dstr(d);
}
function balances() {
  const b = {};
  S.accounts.forEach(a => b[a.id] = a.initial || 0);
  for (const t of S.transactions) {
    if (t.type === 'income') b[t.accountId] += t.amount;
    else if (t.type === 'expense') b[t.accountId] -= t.amount;
    else if (t.type === 'transfer') { b[t.accountId] -= t.amount; if (t.toAccountId in b) b[t.toAccountId] += t.amount; }
  }
  Object.keys(b).forEach(k => b[k] = r2(b[k]));
  return b;
}
const monthTx = (y = M().y, m = M().m) => S.transactions.filter(t => t.date.startsWith(mkey(y, m)));
const sumBy = (arr, type) => r2(arr.filter(t => t.type === type).reduce((s, t) => s + t.amount, 0));
const statList = arr => arr.filter(t => !t.skip).map(t => t.type === 'transfer' && t.asExpense ? { ...t, type: 'expense' } : t);
const sortTx = a => a.slice().sort((x, y) => y.date.localeCompare(x.date) || y.id - x.id);

async function loadAll() {
  const [a, c, t, b, r, m] = await Promise.all(STORES.map(dbAll));
  Object.assign(S, { accounts: a, categories: c, transactions: t, budgets: b, recurring: r });
  const st = m.find(x => x.id === 'settings');
  S.settings = Object.assign({ currency: '₽', lastBackup: null }, st);
  sortAccounts();
}
async function seed() {
  const m = await dbAll('meta');
  if (m.find(x => x.id === 'settings')) return;
  await dbPut('meta', { id: 'settings', currency: '₽', lastBackup: null });
  await dbPut('accounts', { name: 'Основной счёт', initial: 0, icon: '💳', color: '#bb86fc' });
  for (const [type, name, icon, color] of DEFAULT_CATS) await dbPut('categories', { type, name, icon, color });
}
const saveSettings = () => dbPut('meta', { id: 'settings', ...S.settings });

async function runRecurring() {
  const t0 = today();
  for (const r of S.recurring) {
    if (!r.active) continue;
    let n = 0, changed = false;
    while (r.nextDate <= t0 && n++ < 500) {
      const o = { type: r.type, amount: r.amount, accountId: r.accountId, toAccountId: r.toAccountId, categoryId: r.categoryId, date: r.nextDate, note: r.note || '', recId: r.id };
      if (r.skip) o.skip = true;
      if (r.asExpense) o.asExpense = true;
      await dbPut('transactions', o);
      S.transactions.push(o);
      r.nextDate = nextOcc(r.nextDate, r.freq, r.anchorDay);
      changed = true;
    }
    if (changed) await dbPut('recurring', r);
  }
}

let modalOpen = false;
let pickerEl = null;
function closePicker() { if (pickerEl) { pickerEl.remove(); pickerEl = null; } }
function splitOpt(txt) {
  const t = String(txt).trim(), cp = t.codePointAt(0);
  if (cp >= 0x2190) { const m = t.match(/^(\S+)\s+([\s\S]*)$/); if (m) return { ic: m[1], name: m[2] }; }
  return { ic: '', name: t };
}
function openPicker(sel) {
  closePicker();
  const ov = document.createElement('div'); ov.id = 'pickov';
  const list = document.createElement('div'); list.className = 'plist';
  [...sel.options].forEach(o => {
    const row = document.createElement('div');
    row.className = 'popt' + (o.value === sel.value ? ' on' : '');
    const p = splitOpt(o.textContent);
    if (p.ic) { const i = document.createElement('span'); i.className = 'ic'; i.textContent = p.ic; row.appendChild(i); }
    const t = document.createElement('span'); t.className = 't'; t.textContent = p.name; row.appendChild(t);
    const r = document.createElement('span'); r.className = 'r'; row.appendChild(r);
    row.onclick = () => {
      closePicker();
      if (sel.value !== o.value) { sel.value = o.value; sel.dispatchEvent(new Event('change', { bubbles: true })); }
    };
    list.appendChild(row);
  });
  ov.appendChild(list);
  ov.addEventListener('click', e => { if (e.target === ov) closePicker(); });
  document.body.appendChild(ov); pickerEl = ov;
  const on = list.querySelector('.on'); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'center' });
}
function enhanceSelects(root) {
  root.querySelectorAll('select').forEach(sel => {
    if (sel.dataset.pick) return;
    sel.dataset.pick = '1';
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'pick';
    const lab = document.createElement('span'), chev = document.createElement('i'); chev.textContent = '▾';
    btn.appendChild(lab); btn.appendChild(chev);
    const show = () => { const o = sel.options[sel.selectedIndex]; lab.textContent = o ? o.textContent : ''; };
    show(); sel.addEventListener('change', show);
    btn.onclick = () => openPicker(sel);
    sel.style.display = 'none';
    sel.parentNode.insertBefore(btn, sel.nextSibling);
  });
}
function modal(html) {
  const m = $('#modal');
  const closeBtn = !IS_MOBILE ? `<button class="close-btn" data-act="backdrop" aria-label="Закрыть">&times;</button>` : '';
  m.innerHTML = `<div class="sheet" data-stop="1">${closeBtn}${html}</div>`;
  m.classList.add('open');
  if (!modalOpen) { if (!NATIVE) history.pushState({ m: 1 }, ''); modalOpen = true; }
  enhanceSelects(m.firstChild);
  return m.firstChild;
}
function closeModal() {
  closePicker();
  if (!modalOpen) return;
  modalOpen = false;
  $('#modal').classList.remove('open');
  $('#modal').innerHTML = '';
  if (!NATIVE && history.state && history.state.m) history.back();
}
let lastBack = 0, toastTimer;
function flash(msg, ms = 2000) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}
const armBack = () => history.pushState({ app: 1 }, '');

// ИСПРАВЛЕНИЕ: Включаем перехват истории (TRAP) для всех платформ, чтобы iOS не выходил из приложения
const TRAP = true;
if (TRAP) history.replaceState({ root: 1 }, '');
if (TRAP) document.addEventListener('click', armBack, { capture: true, once: true });

window.addEventListener('popstate', () => {
  if (pickerEl) { closePicker(); history.pushState({ m: 1 }, ''); return; }
  if (modalOpen) { modalOpen = false; $('#modal').classList.remove('open'); $('#modal').innerHTML = ''; return; }
  
  // ИСПРАВЛЕНИЕ: Проверяем подразделы ДО проверки root. Теперь iOS будет закрывать Счета/Категории, а не выходить на главную.
  if (U.statCat) { U.statCat = null; render(); armBack(); return; }
  if (U.sub) { U.sub = null; render(); armBack(); return; }
  
  if (!(history.state && history.state.root)) return;
  if (isIOS) { armBack(); return; }
  
  const t = Date.now();
  if (t - lastBack < 2000) { history.back(); return; }
  lastBack = t; flash('Нажмите «Назад» ещё раз, чтобы выйти'); armBack();
});

function openTxModal(t, opt = {}) {

  const cur = t ? { ...t } : { type: 'expense', amount: '', accountId: S.accounts[0].id, toAccountId: (S.accounts[1] || S.accounts[0]).id, categoryId: null, date: today(), note: '', freq: 'monthly', active: true };
  if (rec && t) cur.date = t.nextDate;
  if (rec && !t) cur.freq = 'monthly';

  const fixCat = () => {
    if (cur.type === 'transfer' && !cur.asExpense) return;
    const want = cur.type === 'transfer' ? 'expense' : cur.type;
    const c = catOf(cur.categoryId);
    if (!c || c.type !== want) cur.categoryId = (S.categories.find(x => x.type === want) || {}).id ?? null;
  };
  fixCat();

  const sync = root => {
    cur.amount = root.querySelector('#f_amount').value;
    cur.accountId = Number(root.querySelector('#f_acc').value);
    const to = root.querySelector('#f_to'); if (to) cur.toAccountId = Number(to.value);
    cur.date = root.querySelector('#f_date').value;

    const accOpts = sel => S.accounts.map(a => `<option value="${a.id}" ${a.id === sel ? 'selected' : ''}>${esc(a.icon)} ${esc(a.name)}</option>`).join('');
    const cats = S.categories.filter(c => c.type === cur.type);
    const root = modal(`
      <h2>${rec ? 'Регулярный платёж' : (t ? 'Изменить операцию' : 'Новая операция')}</h2>

      if (t) o.id = t.id;
      if (rec) {
        Object.assign(o, { freq: cur.freq, nextDate: cur.date, anchorDay: parseD(cur.date).getDate(), active: cur.active !== false });
        await dbPut('recurring', o); upsert(S.recurring, o);
        await runRecurring();
      } else {
        o.date = cur.date;
        if (t && t.recId) o.recId = t.recId;
        await dbPut('transactions', o); upsert(S.transactions, o);
      }
      closeModal(); render();
    };
    const del = root.querySelector('#f_del');
    if (del) del.onclick = async () => {
      if (!confirm('Удалить?')) return;
      const st = rec ? 'recurring' : 'transactions';
      await dbDel(st, t.id);
      S[st] = S[st].filter(x => x.id !== t.id);
      closeModal(); render();
    };
  }
  draw();
}

function txRow(t, showDate) {

    if (t.asExpense) {
      const c = catOf(t.categoryId);

      cls = 'minus'; sign = '−'; sub += ' · перевод, в расходах';

    const c = catOf(t.categoryId);

function viewHome() {
  const bal = balances();
  const incl = S.accounts.filter(a => !a.excluded), excl = S.accounts.filter(a => a.excluded);
  const total = r2(incl.reduce((s, a) => s + bal[a.id], 0));
  const mt = statList(monthTx());
  const debt = r2(-excl.reduce((s, a) => s + bal[a.id], 0));
  const withLim = excl.filter(a => a.limit > 0);
  const availT = r2(withLim.reduce((s, a) => s + a.limit + bal[a.id], 0));
  const cOpen = !!S.settings.creditOpen;
  const extra = excl.length ? `<div class="card"><div data-act="toggleCredit" style="cursor:pointer">
      <div class="row"><div class="grow muted">💳 Кредитный баланс</div><div class="muted" style="font-size:12px">${cOpen ? 'Скрыть ▲' : 'Подробнее ▼'}</div></div>
      <div class="row" style="margin-top:8px"><div class="grow"><div class="muted" style="font-size:12px">${debt >= 0 ? 'Долг' : 'Переплата'}</div><div class="amt ${debt > 0 ? 'minus' : 'plus'}" style="font-size:22px">${fmt(Math.abs(debt))}</div></div>
        ${withLim.length ? `<div style="text-align:right"><div class="muted" style="font-size:12px">Доступно</div><div class="amt plus" style="font-size:22px">${fmt(availT)}</div></div>` : ''}</div></div>
    ${cOpen ? excl.map(a => { const d = -bal[a.id]; const p = a.limit > 0 ? Math.min(100, Math.max(0, d / a.limit * 100)) : 0;
      return `<div style="margin-top:16px;cursor:pointer" data-act="editAcc" data-id="${a.id}"><div class="row"><div class="grow">${esc(a.icon)} ${esc(a.name)}</div><div class="amt ${d > 0 ? 'minus' : 'plus'}">${d > 0 ? 'Долг ' : '+'}${fmt(Math.abs(d))}</div></div>
      ${a.limit > 0 ? `<div class="bar"><i style="width:${p}%;background:${p >= 90 ? 'var(--expense)' : p >= 70 ? 'var(--warn)' : 'var(--income)'}"></i></div><div class="sub" style="margin-top:4px">Доступно ${fmt(a.limit + bal[a.id])} из ${fmt(a.limit)}</div>` : ''}</div>`; }).join('') : ''}
    <div class="sub" style="margin-top:16px">Общий баланс с учётом долгов: <b>${fmt(r2(total - debt))}</b></div></div>` : '';
  const days = S.settings.lastBackup ? (Date.now() - S.settings.lastBackup) / 864e5 : Infinity;
  const banner = S.transactions.length && days > 14
    ? `<div class="banner" data-act="goData">${S.settings.lastBackup ? 'Копия данных старше 14 дней' : 'Резервной копии ещё нет'} — нажмите, чтобы сохранить файл. Данные лежат только в браузере телефона.</div>` : '';
  return `<h1>Мой бюджет</h1>${banner}
    <div class="hero"><div class="lbl">Общий баланс</div><div class="big">${fmt(total)}</div>
      <div class="hmonth"><button class="hbtn" data-act="prevM" aria-label="Предыдущий месяц">‹</button><span>${MONTHS[U.month.m]} ${U.month.y}</span><button class="hbtn" data-act="nextM" aria-label="Следующий месяц">›</button></div>
      <div class="split"><div data-act="goStats" data-v="income"><div class="lbl">Доходы ›</div><div class="v plus">+${fmt(sumBy(mt, 'income'))}</div></div>
      <div data-act="goStats" data-v="expense"><div class="lbl">Расходы ›</div><div class="v minus">−${fmt(sumBy(mt, 'expense'))}</div></div></div></div>
    ${extra}
    <div class="accs">${incl.map(a => `<div class="acc" style="border-color:${a.color};${a.excluded ? 'border-style:dashed;opacity:.85' : ''}" data-act="editAcc" data-id="${a.id}"><div class="muted">${esc(a.icon)} ${esc(a.name)}</div><div class="b">${fmt(bal[a.id])}</div>${a.excluded ? '<div class="sub">вне баланса</div>' : ''}</div>`).join('')}
      <div class="acc" style="border-color:var(--line);display:flex;align-items:center;justify-content:center" data-act="addAcc">+ Счёт</div></div>
    <h3>Последние операции</h3>
    ${S.transactions.length ? sortTx(S.transactions).slice(0, 6).map(t => txRow(t, true)).join('') : '<div class="empty">Пока пусто.<br>Нажмите «+», чтобы добавить первую операцию.</div>'}`;
}

function viewOps() {
  return `<h1>Операции</h1>${monthBar()}
    <input id="q" type="search" placeholder="Поиск по заметке, категории, сумме" value="${esc(U.q)}">
    <div class="chips" style="margin:10px 0 4px">${[['all', 'Все'], ['expense', 'Расходы'], ['income', 'Доходы'], ['transfer', 'Переводы']].map(([k, v]) => `<div class="chip ${U.opsType === k ? 'on' : ''}" data-act="opsType" data-v="${k}">${v}</div>`).join('')}</div>
    <div id="oplist">${opsList()}</div>`;
}
function opsList() {
  const q = U.q.trim().toLowerCase();
  const byType = t => U.opsType === 'all' || t.type === U.opsType || (U.opsType === 'expense' && t.type === 'transfer' && t.asExpense);
  let arr = sortTx(monthTx()).filter(byType);
  if (q) arr = arr.filter(t => {
    const c = catOf(t.categoryId);
    return (t.note || '').toLowerCase().includes(q) || (c && c.name.toLowerCase().includes(q)) || String(t.amount).includes(q);
  });
  if (!arr.length) return '<div class="empty">Операций не найдено</div>';
  let html = '', last = '';
  for (const t of arr) {
    if (t.date !== last) { html += `<div class="dayhead">${dateLabel(t.date)}</div>`; last = t.date; }
    html += txRow(t, false);
  }
  return html;
}

function viewStatCat() {
  const id = U.statCat.id, type = U.statType;
  const c = id == null ? null : catOf(id);
  const ids = new Set(statList(monthTx()).filter(t => t.type === type && (t.categoryId ?? null) === id).map(t => t.id));
  const arr = sortTx(monthTx().filter(t => ids.has(t.id)));
  const total = r2(arr.reduce((s, t) => s + t.amount, 0));
  let html = '', last = '';
  for (const t of arr) {
    if (t.date !== last) { html += `<div class="dayhead">${dateLabel(t.date)}</div>`; last = t.date; }
    html += txRow(t, false);
  }
  return `<div class="row" style="margin-bottom:14px"><button class="iconbtn" data-act="statBack">‹</button><h1 style="margin:0">${c ? esc(c.icon) + ' ' + esc(c.name) : 'Без категории'}</h1></div>${monthBar()}
    <div class="card row"><div class="grow muted">${type === 'expense' ? 'Расходы' : 'Доходы'} за месяц · операций: ${arr.length}</div><div class="amt ${type === 'expense' ? 'minus' : 'plus'}">${fmt(total)}</div></div>
    ${html || '<div class="empty">Нет операций за этот месяц</div>'}`;
}

function viewStats() {
  if (U.statCat) return viewStatCat();
  const type = U.statType, mt = statList(monthTx()).filter(t => t.type === type);
  const by = {};
  mt.forEach(t => by[t.categoryId] = (by[t.categoryId] || 0) + t.amount);
  const arr = Object.entries(by).map(([id, v]) => ({ k: id, c: catOf(Number(id)), v: r2(v) })).sort((a, b) => b.v - a.v);
  const total = r2(arr.reduce((s, x) => s + x.v, 0));

  let sumFloors = 0;
  arr.forEach(x => {
    x.exactPct = total ? (x.v / total * 100) : 0;
    x.pct = Math.floor(x.exactPct);
    x.rem = x.exactPct - x.pct;
    sumFloors += x.pct;
  });
  let diffPct = total ? (100 - sumFloors) : 0;
  const sortedByRem = [...arr].sort((a, b) => b.rem - a.rem);
  for (let i = 0; i < diffPct; i++) {
    if (sortedByRem[i]) sortedByRem[i].pct += 1;
  }

  let off = 25;
  const segs = arr.map(x => {
    const p = total ? x.v / total * 100 : 0, col = x.c ? x.c.color : '#666';
    const s = `<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${col}" stroke-width="5" stroke-dasharray="${p} ${100 - p}" stroke-dashoffset="${off}"/>`;
    off -= p; return s;
  }).join('');
  const donut = total ? `<svg viewBox="0 0 42 42" style="width:200px;display:block;margin:0 auto"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="#262626" stroke-width="5"/>${segs}
      <text x="21" y="22" text-anchor="middle" fill="#fff" font-size="3.6" font-weight="700">${esc(fmt(total))}</text></svg>` : '<div class="empty">Нет данных за этот месяц</div>';

  const ms = [];
  for (let i = 5; i >= 0; i--) { const d = new Date(M().y, M().m - i, 1); const t = statList(monthTx(d.getFullYear(), d.getMonth())); ms.push({ l: MONTHS[d.getMonth()].slice(0, 3), i: sumBy(t, 'income'), e: sumBy(t, 'expense') }); }
  const mx = Math.max(1, ...ms.flatMap(x => [x.i, x.e]));
  const bars = ms.map((x, k) => {
    const gx = k * 53 + 6, hi = x.i / mx * 100, he = x.e / mx * 100;
    return `<rect x="${gx}" y="${120 - hi}" width="19" height="${hi}" rx="3" fill="#03dac6"/><rect x="${gx + 22}" y="${120 - he}" width="19" height="${he}" rx="3" fill="#cf6679"/>
      <text x="${gx + 21}" y="138" text-anchor="middle" fill="#a3a3a3" font-size="11">${x.l}</text>`;
  }).join('');

  return `<h1>Статистика</h1>${monthBar()}
    <div class="tabs"><button class="e ${type === 'expense' ? 'on' : ''}" data-act="statType" data-v="expense">Расходы</button><button class="i ${type === 'income' ? 'on' : ''}" data-act="statType" data-v="income">Доходы</button></div>
    <div class="card">${donut}</div>
    <div class="legend">${arr.map(x => `<div class="tx" data-act="statCat" data-id="${esc(x.k)}"><span class="dot" style="background:${x.c ? x.c.color : '#666'}"></span><div class="grow name">${x.c ? esc(x.c.icon) + ' ' + esc(x.c.name) : 'Без категории'}</div><div class="muted">${x.pct}%</div><div class="amt">${fmt(x.v)}</div><span class="muted">›</span></div>`).join('')}</div>
    <h3>Динамика за 6 месяцев</h3>
    <div class="card"><svg viewBox="0 0 320 145" style="width:100%">${bars}</svg>
      <div class="row" style="justify-content:center;font-size:12px"><span class="dot" style="background:#03dac6"></span>Доходы <span class="dot" style="background:#cf6679;margin-left:10px"></span>Расходы</div></div>`;
}

function viewBudgets() {
  const mt = statList(monthTx()).filter(t => t.type === 'expense');
  const items = S.budgets.map(b => {
    const spent = r2(mt.filter(t => b.categoryId === 'all' || t.categoryId === b.categoryId).reduce((s, t) => s + t.amount, 0));
    const c = b.categoryId === 'all' ? null : catOf(b.categoryId);
    const p = spent / b.limit * 100, col = p >= 100 ? 'var(--expense)' : p >= 80 ? 'var(--warn)' : 'var(--income)';
    const left = r2(b.limit - spent);
    return `<div class="card" data-act="editBudget" data-id="${b.id}" style="cursor:pointer"><div class="row"><div class="grow name">${c ? esc(c.icon) + ' ' + esc(c.name) : '📊 Все расходы'}</div><div class="amt">${fmt(spent)} / ${fmt(b.limit)}</div></div>
      <div class="bar"><i style="width:${Math.min(100, p)}%;background:${col}"></i></div>
      <div class="sub" style="margin-top:6px">${left >= 0 ? 'Осталось ' + fmt(left) : 'Превышение ' + fmt(-left)}</div></div>`;
  }).join('');
  return `<h1>Бюджеты</h1>${monthBar()}${items || '<div class="empty">Лимиты на категории помогут держать расходы под контролем.</div>'}
    <button class="btn" data-act="addBudget">Добавить бюджет</button>`;
}

async function saveAccOrder(ids) {

function initAccDrag() {
  const list = $('#acclist');
  if (!list) return;
  list.addEventListener('contextmenu', e => e.preventDefault());
  const items = () => [...list.querySelectorAll(':scope > .menu')];
  const TOUCH = 'ontouchstart' in window;
  const HOLD = 280;
  const SLOP = 16;
  const track = (row, mode, id, x0, y0) => {
    let started = false, startY = y0, lastY = y0, raf = 0, timer = 0, lockY = 0, locked = false, prevOv = ['', ''];
    const apply = () => { row.style.transform = `translateY(${lastY - startY}px)`; };
    const update = () => {
      apply();
      for (let guard = 0; guard < 12; guard++) {
        const arr = items(), i = arr.indexOf(row);
        const rc = row.getBoundingClientRect(), c = rc.top + rc.height / 2;
        const next = arr[i + 1], prev = arr[i - 1];
        let moved = false;
        if (next) { const nb = next.getBoundingClientRect(); if (c > nb.top + nb.height / 2) { list.insertBefore(next, row); moved = true; } }
        if (!moved && prev) { const pb = prev.getBoundingClientRect(); if (c < pb.top + pb.height / 2) { list.insertBefore(prev, row.nextSibling); moved = true; } }
        if (!moved) break;
        startY += row.getBoundingClientRect().top - rc.top;
        apply();
      }
    };
    const hold = () => { if (started && Math.abs(window.scrollY - lockY) > 0.5) window.scrollTo(0, lockY); };
    const tick = () => {
      if (!started) return;
      hold();
      const vh = window.innerHeight; let sp = 0;
      if (lastY < 90) sp = -Math.ceil((90 - lastY) / 6);
      else if (lastY > vh - 150) sp = Math.ceil((lastY - (vh - 150)) / 6);
      if (sp) { const before = window.scrollY; window.scrollBy(0, sp); const real = window.scrollY - before; lockY = window.scrollY; if (real) { startY -= real; update(); } }
      raf = requestAnimationFrame(tick);
    };
    const lockScroll = () => {
      lockY = window.scrollY; locked = true;
      const de = document.documentElement, bd = document.body;
      prevOv = [de.style.overflow, bd.style.overflow];
      de.style.overflow = 'hidden'; bd.style.overflow = 'hidden';
    };
    const unlockScroll = () => {
      if (!locked) return; locked = false;
      document.documentElement.style.overflow = prevOv[0]; document.body.style.overflow = prevOv[1];
    };
    const cleanup = () => {
      clearTimeout(timer); cancelAnimationFrame(raf);
      document.removeEventListener('pointermove', pmove);
      document.removeEventListener('pointerup', pend);
      document.removeEventListener('pointercancel', pend);
      row.removeEventListener('touchmove', tmove);
      row.removeEventListener('touchend', tend);
      row.removeEventListener('touchcancel', tend);
      document.removeEventListener('touchend', tend);
      document.removeEventListener('touchcancel', tend);
      unlockScroll();
    };
    const begin = () => {
      started = true; startY = lastY;
      lockScroll();
      row.classList.add('dragging');
      if (mode === 'pointer') { try { row.setPointerCapture(id); } catch (_) {} }
      if (navigator.vibrate) navigator.vibrate(15);
      raf = requestAnimationFrame(tick);
    };
    const moveTo = (cx, cy) => {
      lastY = cy;
      if (!started) {
        if (Math.abs(cx - x0) > SLOP || Math.abs(cy - y0) > SLOP) cleanup();
        return;
      }
      update();
    };
    const finish = () => {
      const was = started;
      started = false; cleanup();
      if (!was) return;
      row.style.transform = ''; row.classList.remove('dragging');
      suppressClickUntil = Date.now() + 400;
      saveAccOrder(items().map(x => Number(x.dataset.id)));
    };
    const pmove = ev => { if (ev.pointerId === id) moveTo(ev.clientX, ev.clientY); };
    const pend = ev => { if (ev.pointerId === id) finish(); };
    const findT = ev => [...ev.changedTouches].find(t => t.identifier === id);
    const tmove = ev => {
      const t = findT(ev); if (!t) return;
      if (started && ev.cancelable) ev.preventDefault();
      hold();
      moveTo(t.clientX, t.clientY);
    };
    const tend = ev => { if (findT(ev)) finish(); };
    if (mode === 'pointer') {
      document.addEventListener('pointermove', pmove);
      document.addEventListener('pointerup', pend);
      document.addEventListener('pointercancel', pend);
    } else {
      row.addEventListener('touchmove', tmove, { passive: false });
      row.addEventListener('touchend', tend);
      row.addEventListener('touchcancel', tend);
      document.addEventListener('touchend', tend);
      document.addEventListener('touchcancel', tend);
    }
    timer = setTimeout(begin, HOLD);
  };
  items().forEach(row => {
    if (TOUCH) row.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) return;
      const t = e.changedTouches[0];
      track(row, 'touch', t.identifier, t.clientX, t.clientY);
    }, { passive: true });
    row.addEventListener('pointerdown', e => {
      if (TOUCH && e.pointerType === 'touch') return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      track(row, 'pointer', e.pointerId, e.clientX, e.clientY);
    });
  });
}
